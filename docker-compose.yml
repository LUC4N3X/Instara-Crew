services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: instara
      POSTGRES_PASSWORD: instara
      POSTGRES_DB: instara
    ports:
      - "5432:5432"
    volumes:
      - instara_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - instara_redis:/data
    restart: unless-stopped

volumes:
  instara_postgres:
  instara_redis:
