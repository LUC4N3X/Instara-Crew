name: Windows Standalone

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-standalone.yml"
      - "desktop/windows/**"
      - "scripts/migrate-bullmq-postgres.mjs"
      - "src/lib/redis.ts"
      - "src/app/layout.tsx"
      - "package.json"
      - "package-lock.json"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-standalone:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        shell: pwsh
        run: |
          npm ci
          npm install --no-save --package-lock=false pg@8

      - name: Install bundled Playwright Chromium
        shell: pwsh
        run: npx playwright install chromium

      - name: Generate Prisma client
        shell: pwsh
        run: npm run prisma:generate

      - name: Typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Build production application
        shell: pwsh
        run: npm run build

      - name: Assemble installer
        shell: pwsh
        run: ./desktop/windows/build-runtime.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Instara-Crew-Windows-by-LUC4N3X
          path: desktop-dist/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-dist/*.exe
            desktop-dist/*.zip
          generate_release_notes: true
          name: "Instara Crew ${{ github.ref_name }} - by LUC4N3X"
